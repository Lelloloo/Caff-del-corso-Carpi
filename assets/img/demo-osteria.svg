      <rect x="0" y="0" width="170" height="110" rx="8" fill="#141a29" stroke="#252e42"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
      <!-- SVG Fork & Knife Icon -->
      <path d="M22 20 L22 32 M24 20 L24 24 M20 20 L20 24 M28 20 L28 32 M30 20 C30 24 28 26 28 26" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
