      <text x="12" y="76" fill="#94a3b8" font-family="sans-serif" font-size="10">Tagliatelle al ragù antico</text>
      <text x="12" y="96" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">€ [DA COMPILARE]</text>
      
      <!-- Card 2 -->
      <rect x="183" y="0" width="170" height="110" rx="8" fill="#141a29" stroke="#252e42"/>
      <rect x="195" y="12" width="28" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
      <!-- SVG Flame / Grill Icon -->
