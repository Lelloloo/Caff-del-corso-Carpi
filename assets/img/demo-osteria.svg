      <text x="195" y="58" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Secondi alla Brace</text>
      <text x="195" y="76" fill="#94a3b8" font-family="sans-serif" font-size="10">Carni selezionate locali</text>
      <text x="195" y="96" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">€ [DA COMPILARE]</text>
      
      <!-- Card 3 -->
      <rect x="366" y="0" width="170" height="110" rx="8" fill="#141a29" stroke="#252e42"/>
      <rect x="378" y="12" width="28" height="28" rx="6" fill="#38bdf8" opacity="0.2"/>
      <!-- SVG Pin Icon -->
      <path d="M392 20 C388.5 20 386 22.5 386 25.5 C386 29.5 392 34 392 34 C392 34 398 29.5 398 25.5 C398 22.5 395.5 20 392 20 Z" fill="#38bdf8"/>
      <circle cx="392" cy="25" r="2" fill="#141a29"/>
      <text x="378" y="58" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Dove Siamo</text>
      <text x="378" y="76" fill="#94a3b8" font-family="sans-serif" font-size="10">Centro Storico • Aperto sera</text>
      <text x="378" y="96" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Apri Google Maps ›</text>
