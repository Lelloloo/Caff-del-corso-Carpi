  <text x="300" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">osteriadelvicolo.it</text>
  
  <!-- Website Content Preview -->
  <g transform="translate(16, 48)">
    <!-- Header -->
    <text x="16" y="24" fill="#fbbf24" font-family="serif" font-size="16" font-weight="bold">Osteria del Vicolo</text>
    <rect x="430" y="10" width="120" height="26" rx="13" fill="url(#osteria-warm)"/>
    <text x="490" y="27" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Prenota Tavolo</text>
    
    <!-- Hero Banner inside demo -->
    <rect x="16" y="48" width="536" height="130" rx="10" fill="url(#osteria-bg)" stroke="#38281d" stroke-width="1"/>
    <!-- Decorative plate illustration -->
    <circle cx="440" cy="113" r="45" fill="#291e17" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="440" cy="113" r="32" fill="#1f1610"/>
    <path d="M425 113 Q440 98 455 113 Q440 128 425 113" fill="#f59e0b" opacity="0.7"/>
    
    <text x="36" y="86" fill="#fef3c7" font-family="serif" font-size="20" font-weight="bold">Cucina Tradizionale &amp; Vini Locali</text>
    <text x="36" y="112" fill="#d1d5db" font-family="sans-serif" font-size="12">Ingredienti a km 0, pasta fresca fatta a mano ogni giorno.</text>
    <rect x="36" y="130" width="140" height="28" rx="6" fill="#f59e0b"/>
    <text x="106" y="148" fill="#181310" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vedi Menù del Giorno</text>
    
    <!-- Featured Menu Highlights -->
    <g transform="translate(16, 192)">
