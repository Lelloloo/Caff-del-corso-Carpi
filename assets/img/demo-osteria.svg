<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="osteria-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <linearGradient id="osteria-warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Browser Frame -->
  <rect width="600" height="380" rx="12" fill="#0f131c" stroke="#252e42" stroke-width="1.5"/>
  <rect width="600" height="36" rx="12" fill="#141a29"/>
  <!-- Browser dots -->
  <circle cx="24" cy="18" r="4.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="18" r="4.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="56" cy="18" r="4.5" fill="#10b981" opacity="0.8"/>
  <!-- Address bar -->
