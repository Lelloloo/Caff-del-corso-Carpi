<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="avatar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatar-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="120" cy="120" r="115" fill="url(#avatar-glow)"/>
  
  <!-- Outer glowing orbital border -->
  <circle cx="120" cy="120" r="102" stroke="url(#avatar-ring)" stroke-width="2.5" stroke-dasharray="16 8"/>
  
  <!-- Orbit dot -->
  <circle cx="192" cy="48" r="5" fill="#38bdf8"/>
  <circle cx="48" cy="180" r="3.5" fill="#f59e0b"/>
  
  <!-- Inner avatar circle -->
  <circle cx="120" cy="120" r="92" fill="url(#face-grad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Stylized person silhouette / iconography -->
  <!-- Torso -->
  <path d="M60 200 C60 162 86 148 120 148 C154 148 180 162 180 200 Z" fill="#334155"/>
  <path d="M72 200 C72 170 94 158 120 158 C146 158 168 170 168 200 Z" fill="#1e293b"/>
  <!-- Shirt collar -->
  <polygon points="120,172 108,155 132,155" fill="#38bdf8" opacity="0.8"/>
  <!-- Head -->
  <circle cx="120" cy="108" r="36" fill="#475569"/>
  <!-- Hair -->
  <path d="M86 102 C86 74 100 68 120 68 C142 68 154 75 154 102 C146 95 136 93 120 93 C104 93 94 96 86 102 Z" fill="#0f172a"/>
  <!-- Glasses -->
  <rect x="98" y="100" width="18" height="13" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <rect x="124" y="100" width="18" height="13" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="116" y1="106" x2="124" y2="106" stroke="#38bdf8" stroke-width="2"/>
  <!-- Gentle smile -->
  <path d="M112 126 Q120 133 128 126" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
